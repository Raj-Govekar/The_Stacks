<!DOCTYPE html>
<html>
<head>
  <title>The Stacks - Library Management</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Work Sans', sans-serif; 
      background: #FDFBF7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 { 
      color: #2C4C3B; 
      font-size: 3em;
      margin-bottom: 20px;
    }
    p { 
      color: #5C605E; 
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a { 
      background: #2C4C3B; 
      color: white; 
      padding: 12px 24px; 
      text-decoration: none; 
      border-radius: 4px;
      font-weight: bold;
    }
    a:hover { background: #1E3629; }
    .status {
      margin-top: 40px;
      padding: 20px;
      background: #EAF3EB;
      border-radius: 4px;
      border-left: 4px solid #2C4C3B;
    }
    .status h3 { color: #2C4C3B; margin-bottom: 10px; }
    .status p { color: #5C605E; margin: 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 The Stacks</h1>
    <p>Library Management System</p>
    
    <div class="links">
      <a href="https://the-stacks-backend.onrender.com/api/">API Status</a>
      <a href="https://github.com/Raj-Govekar/The_Stacks">GitHub</a>
    </div>
    
    <div class="status">
      <h3>Status</h3>
      <p>✅ Backend: <strong>Live on Render</strong></p>
      <p>🚀 Frontend: <strong>Live on GitHub Pages</strong></p>
      <p>📱 Full app coming soon with React UI</p>
    </div>
  </div>
</body>
</html>
