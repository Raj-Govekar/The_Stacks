<!DOCTYPE html>
<html>
<head>
  <title>The Stacks - Library Management System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #FDFBF7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }
    h1 { color: #2C4C3B; font-size: 2.5em; margin-bottom: 20px; }
    p { color: #5C605E; font-size: 1.1em; margin: 15px 0; }
    a { 
      display: inline-block;
      background: #2C4C3B; 
      color: white; 
      padding: 12px 24px; 
      text-decoration: none; 
      border-radius: 4px;
      margin: 10px;
    }
    a:hover { background: #1E3629; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 The Stacks</h1>
    <p>Library Management System</p>
    <p>Discover books, browse libraries, and manage your collection.</p>
    
    <p>
      <a href="https://the-stacks-backend.onrender.com/api/">Backend API</a>
      <a href="https://github.com/Raj-Govekar/The_Stacks">GitHub</a>
    </p>
    
    <p style="margin-top: 40px; font-size: 0.9em; color: #999;">
      ✅ System Status: Online
    </p>
  </div>
</body>
</html>
